<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Open Control Engine architecture: the CDL §7.17 non-computational seam</title>
  <desc id="desc">A host application drives the engine through the oce-api facade. The deterministic execution core (Group A) sees only blocks, connections, and values and has no database. Everything non-computational — topology, points, parameters, trends, semantics, and durability — sits behind the oce-store port, reached only through traits, with an in-memory default and app-side adapters.</desc>

  <rect width="960" height="490" fill="#ffffff"/>

  <!-- Host application -->
  <rect x="20" y="20" width="920" height="48" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="480" y="49" text-anchor="middle" font-size="14" font-weight="600" fill="#202124">Host application — owns process lifecycle, transport, TLS, auth, durability, and metrics</text>

  <!-- Facade -->
  <rect x="80" y="88" width="800" height="56" rx="8" fill="#fef7e0" stroke="#ea8600" stroke-width="1.5"/>
  <text x="480" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#202124">oce-api — the embeddable facade</text>
  <text x="480" y="131" text-anchor="middle" font-size="12" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Engine&lt;S: Store = MemStore&gt;&#8195;·&#8195;package oce-api</text>

  <!-- arrows from facade -->
  <path d="M300 144 L300 178" stroke="#9aa0a6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M770 144 L770 178" stroke="#9aa0a6" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Execution core (Group A) -->
  <rect x="20" y="180" width="560" height="290" rx="10" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="300" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#174ea6">Execution core · Group A</text>
  <text x="300" y="230" text-anchor="middle" font-size="12.5" fill="#174ea6">deterministic · in-memory · NO database · the hot path</text>

  <!-- crate chips: 3 columns x 3 rows -->
  <g font-size="12.5" font-weight="600" fill="#1967d2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect x="40"  y="246" width="160" height="34" rx="6" fill="#ffffff" stroke="#aecbfa"/><text x="120" y="268" text-anchor="middle">oce-model</text>
    <rect x="218" y="246" width="160" height="34" rx="6" fill="#ffffff" stroke="#aecbfa"/><text x="298" y="268" text-anchor="middle">oce-expr</text>
    <rect x="396" y="246" width="160" height="34" rx="6" fill="#ffffff" stroke="#aecbfa"/><text x="476" y="268" text-anchor="middle">oce-blocks</text>
    <rect x="40"  y="288" width="160" height="34" rx="6" fill="#ffffff" stroke="#aecbfa"/><text x="120" y="310" text-anchor="middle">oce-flatten</text>
    <rect x="218" y="288" width="160" height="34" rx="6" fill="#ffffff" stroke="#aecbfa"/><text x="298" y="310" text-anchor="middle">oce-validate</text>
    <rect x="396" y="288" width="160" height="34" rx="6" fill="#ffffff" stroke="#aecbfa"/><text x="476" y="310" text-anchor="middle">oce-graph</text>
    <rect x="40"  y="330" width="160" height="34" rx="6" fill="#ffffff" stroke="#aecbfa"/><text x="120" y="352" text-anchor="middle">oce-cxf</text>
    <rect x="218" y="330" width="160" height="34" rx="6" fill="#ffffff" stroke="#aecbfa"/><text x="298" y="352" text-anchor="middle">oce-semantics</text>
    <rect x="396" y="330" width="160" height="34" rx="6" fill="#ffffff" stroke="#aecbfa"/><text x="476" y="352" text-anchor="middle">oce-diag</text>
  </g>
  <text x="300" y="392" text-anchor="middle" font-size="12" fill="#174ea6" font-style="italic">frozen Kahn schedule over flat arrays — no graph walk, no hashing, no store access</text>
  <text x="300" y="432" text-anchor="middle" font-size="13" fill="#174ea6">load → flatten → validate → schedule → tick → simulate</text>

  <!-- the seam -->
  <line x1="592" y1="188" x2="592" y2="464" stroke="#5f6368" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="592" y="176" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5f6368">CDL §7.17 seam</text>

  <!-- Storage port -->
  <rect x="604" y="180" width="336" height="290" rx="10" fill="#e6f4ea" stroke="#137333" stroke-width="2"/>
  <text x="772" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#0d652d">Storage behind the port</text>
  <text x="772" y="230" text-anchor="middle" font-size="12.5" fill="#0d652d">non-computational · traits only</text>

  <g>
    <rect x="624" y="248" width="296" height="48" rx="6" fill="#ffffff" stroke="#a8dab5"/>
    <text x="772" y="269" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d652d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">oce-store</text>
    <text x="772" y="286" text-anchor="middle" font-size="11" fill="#5f6368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ModelStore · PointStore · SemanticStore</text>

    <rect x="624" y="306" width="296" height="40" rx="6" fill="#ffffff" stroke="#a8dab5"/>
    <text x="772" y="331" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0d652d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">oce-store-mem (default)</text>

    <rect x="624" y="358" width="296" height="52" rx="6" fill="#fce8e6" stroke="#d93025" stroke-dasharray="5 4"/>
    <text x="772" y="379" text-anchor="middle" font-size="12.5" font-weight="600" fill="#a50e0e">your app-side adapter</text>
    <text x="772" y="397" text-anchor="middle" font-size="11" fill="#a50e0e">graph DB · SQL · time-series · …</text>
  </g>
  <text x="772" y="440" text-anchor="middle" font-size="11.5" fill="#0d652d" font-style="italic">the library ships no first-party database</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa0a6"/>
    </marker>
  </defs>
</svg>
