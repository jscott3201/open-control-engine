<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="ptitle pdesc">
  <title id="ptitle">Open Control Engine execution pipeline</title>
  <desc id="pdesc">A model is loaded from CXF and lowered by the resolver, validated, and compiled into a frozen topological schedule once per load (the BUILD phase, off the hot path). The frozen schedule is then evaluated tick by tick on a deterministic hot path; the scheduler uses preallocated schedule and state and performs no I/O.</desc>

  <rect width="880" height="250" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#202124">From CXF to simulated control signals</text>

  <defs>
    <marker id="parrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <!-- BUILD stages (blue) -->
  <g>
    <rect x="105" y="64" width="118" height="66" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
    <text x="164" y="92"  text-anchor="middle" font-size="13.5" font-weight="700" fill="#174ea6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">load</text>
    <text x="164" y="112" text-anchor="middle" font-size="11" fill="#5f6368">ingest, lower CXF</text>

    <rect x="243" y="64" width="118" height="66" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
    <text x="302" y="92"  text-anchor="middle" font-size="13.5" font-weight="700" fill="#174ea6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">validate</text>
    <text x="302" y="112" text-anchor="middle" font-size="11" fill="#5f6368">conformance gate</text>

    <rect x="381" y="64" width="118" height="66" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.8"/>
    <text x="440" y="92"  text-anchor="middle" font-size="13.5" font-weight="700" fill="#174ea6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">schedule</text>
    <text x="440" y="112" text-anchor="middle" font-size="11" fill="#5f6368">Kahn topo-sort</text>
  </g>

  <!-- TICK stages (green) -->
  <g>
    <rect x="519" y="64" width="118" height="66" rx="8" fill="#e6f4ea" stroke="#137333" stroke-width="1.8"/>
    <text x="578" y="92"  text-anchor="middle" font-size="13.5" font-weight="700" fill="#0d652d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">prepare</text>
    <text x="578" y="112" text-anchor="middle" font-size="11" fill="#5f6368">complete inputs</text>

    <rect x="657" y="64" width="118" height="66" rx="8" fill="#e6f4ea" stroke="#137333" stroke-width="1.8"/>
    <text x="716" y="92"  text-anchor="middle" font-size="13.5" font-weight="700" fill="#0d652d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">execute</text>
    <text x="716" y="112" text-anchor="middle" font-size="11" fill="#5f6368">owned result</text>
  </g>

  <!-- arrows -->
  <g stroke="#9aa0a6" stroke-width="1.6" fill="none">
    <path d="M223 97 L243 97" marker-end="url(#parrow)"/>
    <path d="M361 97 L381 97" marker-end="url(#parrow)"/>
    <path d="M499 97 L519 97" marker-end="url(#parrow)"/>
    <path d="M637 97 L657 97" marker-end="url(#parrow)"/>
  </g>

  <!-- phase brackets -->
  <path d="M105 150 L105 162 L499 162 L499 150" fill="none" stroke="#1a73e8" stroke-width="1.5"/>
  <text x="302" y="184" text-anchor="middle" font-size="12.5" font-weight="600" fill="#174ea6">BUILD — once per load, off the hot path</text>

  <path d="M519 150 L519 162 L775 162 L775 150" fill="none" stroke="#137333" stroke-width="1.5"/>
  <text x="647" y="184" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0d652d">TICK — the hot path</text>
  <text x="647" y="202" text-anchor="middle" font-size="11" fill="#5f6368">no I/O · preallocated schedule and state</text>
</svg>
