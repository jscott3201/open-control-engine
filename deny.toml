# cargo-deny baseline for open-control.
#
# The library ships no first-party database; its build pulls only serde/serde_json/thiserror
# from crates.io (D-OWNER-1). The allow-list below is kept deliberately broad so common
# permissive licenses in any future transitive tree pass without churn.
#   - dual MIT OR Apache-2.0 project license; permissive allow-list for transitive deps
#   - crates.io is the only registry; the library declares no git sources. A consuming
#     application that wires a git-sourced store adapter manages that in its own deny config.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Documented advisory ignores must carry reason + owner.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "BSL-1.0",
  # MPL-2.0: file-level copyleft (NOT infectious to dependents). Retained on the allow-list
  # as a permissive-enough license a downstream store adapter might pull (e.g. via imbl);
  # open-control itself stays dual MIT/Apache-2.0 and pulls no MPL code.
  "MPL-2.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
# The internal `oce-*` crates carry an explicit `version` alongside their `path` (see the root
# Cargo.toml), so they are not wildcard deps; this keeps `wildcards = "deny"` meaningful for any
# real crates.io wildcard requirement.
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git sources are allowed; every dependency resolves from crates.io. The library ships no
# first-party database, so it declares no git source. A consuming application that wires a
# git-sourced store adapter pins that source in its own workspace's deny config.
allow-git = []
