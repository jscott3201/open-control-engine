# Manual regeneration for the retained two-architecture CDL.Reals.Line evidence.
# Containers run offline; source and image materialization happen in separate host steps.
name: OpenModelica Line evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openmodelica-line-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-evidence:
    name: native ${{ matrix.architecture }} evidence
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pinned source commits on the host
        env:
          BUILDINGS: ${{ runner.temp }}/modelica-buildings
          MODELICA: ${{ runner.temp }}/modelica-standard-library
        run: >-
          git clone --no-checkout https://github.com/lbl-srg/modelica-buildings.git "$BUILDINGS" &&
          git -C "$BUILDINGS" checkout --detach a131864e4c4df22ebcd52bb8da439de0087ac365 &&
          test "$(git -C "$BUILDINGS" rev-parse 'HEAD^{tree}')" = a2f4b04c59bdaac9c3fb64a7cda8c532a5fcae09 &&
          git clone --no-checkout https://github.com/OpenModelica/OpenModelica-ModelicaStandardLibrary.git "$MODELICA" &&
          git -C "$MODELICA" checkout --detach 7a4bf7de77a3986e8eb1e88cbb515d646f78f834 &&
          test "$(git -C "$MODELICA" rev-parse 'HEAD^{tree}')" = 43d7d8fc1a991358e9e5e91976e27cdc4280173f
      - name: Materialize the immutable platform image
        env:
          IMAGE: openmodelica/openmodelica@sha256:79ddca5f56265f2b5811140589eccd809f7522ec5c553ae631ef606eeb8f9864
          PLATFORM: ${{ matrix.platform }}
        run: >-
          docker pull --platform "$PLATFORM" "$IMAGE" &&
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' | grep -Fq "\"$IMAGE\""
      - name: Materialize pinned Rust dependencies on the host
        run: cargo fetch --manifest-path tools/openmodelica-line-reference/Cargo.toml --locked
      - name: Regenerate with offline containers
        env:
          BUILDINGS: ${{ runner.temp }}/modelica-buildings
          MODELICA: ${{ runner.temp }}/modelica-standard-library
          EVIDENCE: ${{ runner.temp }}/line-${{ matrix.architecture }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/line-cargo-target
        run: >-
          sh tools/openmodelica-line-reference/line/regenerate.sh "$BUILDINGS" "$MODELICA" "$EVIDENCE" &&
          git diff --exit-code &&
          test -z "$(git status --porcelain)"
      - name: Upload bounded native evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openmodelica-line-${{ matrix.architecture }}
          path: ${{ runner.temp }}/line-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14
