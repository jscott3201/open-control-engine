# Manual generation and assembly of candidate evidence. This workflow does not
# ratify or update the committed fixture.
name: OpenModelica Reliefs evidence

on:
  workflow_dispatch:
  push:
    branches:
      - reliefs-evidence-transport

permissions:
  contents: read

concurrency:
  group: openmodelica-reliefs-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-evidence:
    name: native ${{ matrix.architecture }} evidence
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d16cf2052ae92ebd90c3cad20ac987e8411148c
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Materialize pinned source commits on the host
        env:
          BUILDINGS: ${{ runner.temp }}/modelica-buildings
          MODELICA: ${{ runner.temp }}/modelica-standard-library
        run: >-
          git clone --no-checkout https://github.com/lbl-srg/modelica-buildings.git "$BUILDINGS" &&
          git -C "$BUILDINGS" checkout --detach a131864e4c4df22ebcd52bb8da439de0087ac365 &&
          test "$(git -C "$BUILDINGS" rev-parse 'HEAD^{tree}')" = a2f4b04c59bdaac9c3fb64a7cda8c532a5fcae09 &&
          git clone --no-checkout https://github.com/OpenModelica/OpenModelica-ModelicaStandardLibrary.git "$MODELICA" &&
          git -C "$MODELICA" checkout --detach 7a4bf7de77a3986e8eb1e88cbb515d646f78f834 &&
          test "$(git -C "$MODELICA" rev-parse 'HEAD^{tree}')" = 43d7d8fc1a991358e9e5e91976e27cdc4280173f
      - name: Materialize the immutable platform image
        env:
          IMAGE: openmodelica/openmodelica@sha256:79ddca5f56265f2b5811140589eccd809f7522ec5c553ae631ef606eeb8f9864
          PLATFORM: ${{ matrix.platform }}
        run: >-
          docker pull --platform "$PLATFORM" "$IMAGE" &&
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' | grep -Fq "\"$IMAGE\""
      - name: Materialize pinned Rust dependencies on the host
        run: cargo fetch --manifest-path tools/openmodelica-reliefs-reference/Cargo.toml --locked
      - name: Generate candidate artifact with offline containers
        env:
          BUILDINGS: ${{ runner.temp }}/modelica-buildings
          MODELICA: ${{ runner.temp }}/modelica-standard-library
          EVIDENCE: ${{ runner.temp }}/reliefs-${{ matrix.architecture }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/reliefs-cargo-target
        run: sh tools/openmodelica-reliefs-reference/reliefs/regenerate.sh "$BUILDINGS" "$MODELICA" "$EVIDENCE"
      - name: Verify the candidate artifact to be uploaded
        env:
          EVIDENCE: ${{ runner.temp }}/reliefs-${{ matrix.architecture }}
        run: >-
          python3 -B tools/openmodelica-reliefs-reference/reliefs/verify_evidence.py architecture-checkout "$EVIDENCE" . "${{ matrix.architecture }}" &&
          cargo run --manifest-path tools/openmodelica-reliefs-reference/Cargo.toml --locked -- verify-architecture-canonical "$EVIDENCE" &&
          test -z "$(git status --short --ignored -- tools/openmodelica-reliefs-reference/reliefs/__pycache__)" &&
          git diff --exit-code &&
          test -z "$(git status --porcelain)"
      - name: Upload verified candidate native evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openmodelica-reliefs-${{ matrix.architecture }}
          path: ${{ runner.temp }}/reliefs-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 14

  assemble-candidate:
    name: assemble native candidates
    needs: native-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d16cf2052ae92ebd90c3cad20ac987e8411148c
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Materialize pinned Rust dependencies on the host
        run: cargo fetch --manifest-path tools/openmodelica-reliefs-reference/Cargo.toml --locked
      - name: Download arm64 candidate
        uses: actions/download-artifact@v7.0.0
        with:
          name: openmodelica-reliefs-arm64
          path: ${{ runner.temp }}/reliefs-arm64
      - name: Download amd64 candidate
        uses: actions/download-artifact@v7.0.0
        with:
          name: openmodelica-reliefs-amd64
          path: ${{ runner.temp }}/reliefs-amd64
      - name: Assemble the uploaded native candidates
        run: >-
          sh tools/openmodelica-reliefs-reference/reliefs/assemble.sh
          "${{ runner.temp }}/reliefs-arm64"
          "${{ runner.temp }}/reliefs-amd64"
          "${{ runner.temp }}/reliefs-assembled" &&
          python3 -B tools/openmodelica-reliefs-reference/reliefs/verify_evidence.py
          candidate-final "${{ runner.temp }}/reliefs-assembled" .
      - name: Upload assembled candidate evidence
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openmodelica-reliefs-assembled-candidate
          path: ${{ runner.temp }}/reliefs-assembled
          if-no-files-found: error
          retention-days: 14
