# Validate the documentation site on development PRs and publish released truth from main.
#
# PRs into `development` (and pushes to it) stage the docs, build mdBook and check links and
# anchors without publishing. A push to `main` that touches the docs, or a manual dispatch on
# `main`, also deploys the built site to GitHub Pages. Path-filtered, so this is not a required
# status; the per-PR gate (pr-gate.yml) already runs the authority projection check on every PR.

name: docs-pages

on:
  pull_request:
    branches: [development]
    paths:
      - ".github/workflows/docs-pages.yml"
      - "docs/**"
      - "README.md"
      - "scripts/docs/**"
      - "scripts/authority_claims/**"
      - "site/**"
  push:
    branches: [development, main]
    paths:
      - ".github/workflows/docs-pages.yml"
      - "docs/**"
      - "README.md"
      - "scripts/docs/**"
      - "scripts/authority_claims/**"
      - "site/**"
  workflow_dispatch:

concurrency:
  group: docs-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build docs artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install checksum-pinned mdBook
        run: bash scripts/docs/install-mdbook.sh target/mdbook-bin

      - name: Test documentation checker contracts
        run: python3 scripts/docs/test_check_links.py

      - name: Test authority literals through staging and mdBook
        run: python3 scripts/docs/test_authority_literals.py --mdbook target/mdbook-bin/mdbook

      - name: Check generated authority projection
        run: python3 scripts/authority_claims/check.py --check

      - name: Stage documentation without source writes
        env:
          DOCS_REPOSITORY_REVISION: ${{ github.sha }}
        run: >-
          python3 scripts/docs/check_integrity.py
          --output target/docs-book
          --revision "$DOCS_REPOSITORY_REVISION"

      - name: Build mdBook
        run: target/mdbook-bin/mdbook build target/docs-book

      - name: Check generated internal links and anchors
        run: >-
          python3 scripts/docs/check_links.py
          target/docs-book/book
          --site-prefix /open-control-engine/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: target/docs-book/book

  deploy:
    name: deploy released docs
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
