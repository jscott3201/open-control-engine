# Release gate for open-control (the Open Control Engine) — runs on `development` -> `main`
# release PRs (base branch: main), manual dispatch, and a daily scheduled run against the
# `development` tip.
#
# DISJOINT from ci.yml by base branch. GitHub keys `pull_request: branches:` on the PR's BASE
# (target) branch, so:
#   * a feature -> `development` PR matches ci.yml ONLY (the light per-change gate), and
#   * a `development` -> `main` release PR matches THIS workflow ONLY.
# The two never both fire on one PR; there is no double-run.
#
# Until the first `main` release PR exists, `workflow_dispatch` and the daily cron exercise this gate.
# Scheduled and manually-dispatched runs explicitly checkout `development`, so they continue to test
# the integration tip even after `main` becomes the default branch. The explicit `|| github.event_name
# == ...` clauses in each `if:` document the non-PR paths and avoid relying on GitHub's null coercion.
#
# WHAT RUNS HERE vs. ci.yml:
#   * NEW value — the FULL test suite. ci.yml runs only the targeted `oce-api`/`oce-blocks`/`oce-expr`
#     determinism subset, so this gate is the first place every OTHER crate's tests execute:
#       - `cargo nextest run` for every unit + integration test in the workspace,
#       - `cargo nextest run --cargo-profile release` for release-codegen panic-freedom regressions,
#       - `cargo test --doc`  for doctests (nextest cannot run doctests),
#       - two armed per-crate public-API surface snapshots (`oce-api` and `oce-store`).
#     `--no-tests=fail` is explicit: a run that discovers zero tests HARD-FAILS, catching the
#     regression where tests silently stop compiling or being discovered. It covers unit tests,
#     the workspace's integration-test targets (`crates/*/tests/`, including the `oce-cxf`
#     round-trip and deferral suites), and — via the separate `cargo test --doc` step — the
#     doctests nextest cannot run.
#   * Re-run of the light correctness gates against the RELEASE TIP. A `development` -> `main`
#     PR matches no other workflow, so without these the release PR would be ENTIRELY ungated.
#     `development` also drifts between the last per-PR run and the release cut, and the merge
#     commit landing on `main` is the shipped artifact — re-validating the exact tip is correct,
#     not wasteful: fmt, file-size cap, no-secret scan, default-no-db, clippy -D warnings,
#     workspace build, rustdoc -D warnings, cargo-machete, stale crate-status header lint, and
#     gate-script behavior fixtures.
#   * cargo-deny runs UNCONDITIONALLY here (no paths-filter gating, unlike ci.yml) and adds
#     `advisories` — a release warrants a full advisories/bans/licenses/sources sweep.
#
# Deferred until first publish (matches ci.yml header): the cargo-about THIRDPARTY.md
# attribution-currency gate — its natural home is this release gate; restore it before the
# first crates.io publish.
#
# Security: no `${{ github.event.* }}` in any `run:` (confined to if:/with:/env:).

name: release-gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Daily development-tip heavy gate. GitHub schedules run on the default branch, so checkout below
    # pins scheduled jobs back to `development`.
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # SINGLE SOURCE OF TRUTH for the gate-only nightly (one leg of the COMPAT TRIPLE pinned in
  # crates/oce-api/Cargo.toml and crates/oce-store/Cargo.toml). Consumed below by the install step
  # (as `$NIGHTLY`) and by each surface-gate step (as the `OCE_PUBLIC_API_NIGHTLY` arming value) so
  # the steps cannot drift. A plain workflow env var, not `github.event.*` — safe to read inside
  # `run:`. Bump here + re-bless.
  #
  # This nightly's OWN version is a floor on the workspace MSRV: it identifies as
  # `rustc 1.97.0-nightly`, and `cargo +$NIGHTLY rustdoc` resolves the whole workspace, so a
  # `rust-version` in the root Cargo.toml ABOVE it fails every package here before rustdoc runs.
  # See the comment on `rust-version` in Cargo.toml. Bumping this value is therefore the ONLY way
  # to raise the MSRV past 1.97.0, and it also requires re-blessing both public-api baselines.
  NIGHTLY: nightly-2026-05-01
  CHECKOUT_REF: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'development' || github.ref }}

permissions:
  contents: read

jobs:
  test-suite:
    name: full test suite (nextest + doctests)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
      # Gate-only nightly for the `cargo public-api` surface snapshots (crates/oce-api/tests/
      # public_api.rs and crates/oce-store/tests/public_api.rs, exit #7). Installed but NOT made the
      # default — the workspace still builds on 1.97.1 above; each test shells out to THIS exact
      # toolchain to emit rustdoc JSON. It is one leg of the (public-api, rustdoc-json, nightly)
      # COMPAT TRIPLE pinned in both crates' Cargo.toml files (a format_version skew fails the JSON
      # parse); bump `$NIGHTLY` (above) + all three together and re-bless the baselines.
      - name: install gate-only nightly (cargo public-api)
        run: rustup toolchain install "$NIGHTLY" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143
      - name: Clear cached nextest reports
        run: rm -f target/nextest/{ci,ci-release,public-api-oce-api,public-api-oce-store}/junit.xml
      # Unit + integration tests. `--no-tests=fail` makes the hard-fail-on-empty intent
      # explicit (nextest's default is `auto`, which only *happens* to resolve to fail for a
      # whole-workspace run — pinning it keeps the gate correct if the invocation ever narrows).
      # The public-api snapshot test SKIPS here (unarmed) — it gets its own step below.
      - name: cargo nextest run (unit + integration)
        run: cargo nextest run --workspace --locked --profile ci --no-tests=fail
      # Same suite under release codegen. `ci-release` inherits the `ci` runner policy and writes a
      # separate JUnit report; the explicit cargo profile is what strips debug_assert paths and
      # exercises release panic-freedom.
      - name: cargo nextest run --release (unit + integration)
        run: cargo nextest run --workspace --locked --profile ci-release --cargo-profile release --no-tests=fail
      # Doctests — the second mandatory step, since nextest does not run doctests.
      - name: cargo test --doc (doctests)
        run: cargo test --workspace --doc --locked
      # Public-API surface gates (exit #7 surface-enumeration). Each crate runs as its OWN step under
      # a dedicated child of the `public-api` nextest profile (.config/nextest.toml). The base profile
      # gives the nested cold `cargo +nightly rustdoc` build a longer timeout; the children preserve
      # separate JUnit reports. `--no-tests=fail` HARD-FAILS if either test vanishes (rename / delete /
      # #[ignore] / filter-miss), which raw `cargo test` would let pass silently green. Do NOT merge
      # the two package selectors: one surviving crate would hide the other vanished test and turn a
      # B3 false-green.
      #
      # ARMING (B3 — the gate's highest-stakes property), two interlocking env vars, DO NOT REMOVE:
      #   * OCE_PUBLIC_API_NIGHTLY — names the nightly to shell out to (= the single-source `$NIGHTLY`
      #     installed above), and ARMS the snapshot; unset, the test skips.
      #   * OCE_REQUIRE_SURFACE_CHECK=1 — makes a missing/empty nightly a HARD PANIC, not a silent
      #     skip. So dropping the arming env from either surface step turns the gate RED, never green.
      #     It is set only on these surface steps, so the workspace-wide nextest step above still
      #     skips this test unarmed.
      # The oce-api test fails hard on any tooling error and diffs oce_api's public surface against the
      # blessed crates/oce-api/tests/public-api.txt.
      - name: cargo public-api surface gate (oce-api)
        env:
          OCE_PUBLIC_API_NIGHTLY: ${{ env.NIGHTLY }}
          OCE_REQUIRE_SURFACE_CHECK: "1"
        run: >-
          cargo nextest run -p oce-api
          -E 'test(public_api_surface_matches_blessed_baseline)'
          --profile public-api-oce-api --locked --no-tests=fail
      # Separate step for oce-store's own baseline. Keeping the package selector isolated preserves
      # vanish->RED for this re-exported port surface.
      - name: cargo public-api surface gate (oce-store)
        env:
          OCE_PUBLIC_API_NIGHTLY: ${{ env.NIGHTLY }}
          OCE_REQUIRE_SURFACE_CHECK: "1"
        run: >-
          cargo nextest run -p oce-store
          -E 'test(public_api_surface_matches_blessed_baseline)'
          --profile public-api-oce-store --locked --no-tests=fail
      - name: Require complete nextest JUnit report set
        run: >-
          for profile in ci ci-release public-api-oce-api public-api-oce-store;
          do test -s "target/nextest/$profile/junit.xml";
          done
      - name: Upload nextest JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nextest-release-suite
          path: |
            target/nextest/ci/junit.xml
            target/nextest/ci-release/junit.xml
            target/nextest/public-api-oce-api/junit.xml
            target/nextest/public-api-oce-store/junit.xml
          if-no-files-found: error
          retention-days: 14

  fmt:
    name: fmt
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  file-size-cap:
    name: file-size cap (700 LOC)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - run: bash .github/scripts/check-file-size.sh

  no-secret-scan:
    name: no-secret scan
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - run: bash .github/scripts/check-no-secrets.sh

  gate-fixtures:
    name: gate behavior fixtures
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - name: no-db gate fixtures
        run: bash .github/scripts/test-check-default-no-db.sh
      - name: golden-gen firewall fixtures
        run: bash .github/scripts/test-check-golden-gen-anti-tautology.sh
      - name: stale crate-status fixtures
        run: bash .github/scripts/test-check-stale-crate-status.sh
      - name: stale crate-status smoke
        run: bash .github/scripts/check-stale-crate-status.sh
      - name: workflow gate fixtures
        run: bash .github/scripts/test-workflow-gates.sh
      - name: real workflow smoke
        run: bash .github/scripts/check-workflow-gates.sh

  unused-deps:
    name: unused dependency gate (cargo-machete)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  default-no-db:
    name: default build links no database / async runtime
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: bash .github/scripts/check-default-no-db.sh

  golden-gen-firewall:
    name: golden-gen anti-tautology firewall
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: bash .github/scripts/check-golden-gen-anti-tautology.sh

  clippy:
    name: clippy (-D warnings)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (default — no DB)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: build
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (default — no DB)
        run: cargo build --workspace --locked

  rustdoc:
    name: rustdoc (-D warnings)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc — libs (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --lib --document-private-items --locked
      - name: cargo doc — bins (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --bins --document-private-items --locked

  deny:
    name: cargo-deny (full)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check bans licenses sources advisories

  # The gate script in `full` mode, EXECUTED rather than parsed. See the twin job in ci.yml for
  # why this is a coverage backstop and explicitly NOT a parity check.
  #
  # `full` is the higher-stakes half. AGENTS.md instructs every agent to run `bash .agents/gate.sh
  # full` before claiming a change's tests pass — the per-PR gate runs only
  # oce-api/oce-blocks/oce-expr, so
  # for a change confined to any other crate that claim rests entirely on this script. Running it
  # here is what keeps the commands behind that instruction under CI observation.
  #
  # Wall-clock cost is nil: `test-suite` above is a ~22-minute long pole and this job runs beside
  # it, so it finishes well inside the time that job already takes.
  gate:
    name: gate (full)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.143,cargo-deny,cargo-machete
      - run: bash .agents/gate.sh full
