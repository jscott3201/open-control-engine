# Release gate for open-control (the Open Control Engine) — runs on GitHub Actions for
# `development` -> `main` release PRs (base branch: main), pushes to `main`, manual dispatch, and a
# daily scheduled run against the `development` tip.
#
# DISJOINT from pr-gate.yml by base branch. GitHub keys `pull_request: branches:` on the PR's BASE
# (target) branch, so:
#   * a feature -> `development` PR matches pr-gate.yml ONLY (the light per-change gate), and
#   * a `development` -> `main` release PR matches THIS workflow ONLY.
# The two never both fire on one PR; there is no double-run. A push to `main` (the merged release)
# re-runs this gate against the shipped commit.
#
# Until the first `main` release PR exists, `workflow_dispatch` and the daily cron exercise this gate.
# Scheduled and manually-dispatched runs explicitly checkout `development`, so they continue to test
# the integration tip even after `main` becomes the default branch.
#
# Linux x86_64 only. Every job runs on every trigger, drafts included; no gating job carries a
# job-level `if:`. Jobs that share a build shape with pr-gate.yml use the same rust-cache
# `shared-key`, so the daily scheduled run (default branch `development`) seeds the cache scope every
# PR into `development` can read. nextest JUnit reports are required to exist but are not uploaded as artifacts.
# `CI OK` at the bottom is the single required status for branch protection on `main`.
#
# WHAT RUNS HERE vs. pr-gate.yml:
#   * NEW value — the FULL test suite. pr-gate.yml runs only the targeted `oce-api`/`oce-blocks`/`oce-expr`
#     determinism subset, so this gate is the first place every OTHER crate's tests execute:
#       - `cargo nextest run` for every unit + integration test in the workspace,
#       - `cargo nextest run --cargo-profile release` for release-codegen panic-freedom regressions,
#       - `cargo test --doc`  for doctests (nextest cannot run doctests).
#     `--no-tests=fail` is explicit: a run that discovers zero tests HARD-FAILS, catching the
#     regression where tests silently stop compiling or being discovered. It covers unit tests,
#     the workspace's integration-test targets (`crates/*/tests/`, including the `oce-cxf`
#     round-trip and deferral suites), and — via the separate `cargo test --doc` step — the
#     doctests nextest cannot run.
#   * Re-run of the light correctness gates against the RELEASE TIP. A `development` -> `main`
#     PR matches no other workflow, so without these the release PR would be ENTIRELY ungated.
#     `development` also drifts between the last per-PR run and the release cut, and the merge
#     commit landing on `main` is the shipped artifact — re-validating the exact tip is correct,
#     not wasteful: fmt, file-size cap, no-secret scan, default-no-db, clippy -D warnings,
#     workspace build, rustdoc -D warnings, cargo-machete, the package/feature/publication contract,
#     stale crate-status header lint, and gate-script behavior fixtures.
#   * cargo-deny here adds `advisories` to the bans/licenses/sources checks pr-gate.yml runs — a
#     release warrants a full advisories/bans/licenses/sources sweep.
#
# Deferred until first publish: the cargo-about THIRDPARTY.md
# attribution-currency gate — its natural home is this release gate; restore it before the
# first crates.io publish.
#
# Security: no `${{ github.event.* }}` in any `run:` (confined to if:/with:/env:).

name: release-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Daily development-tip heavy gate. Schedules run on the default branch, so checkout below
    # pins scheduled jobs back to `development`.
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # Build-cost trims for hosted runners (disk and time); neither changes generated code.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CHECKOUT_REF: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'development' || github.ref }}

defaults:
  run:
    shell: bash

jobs:
  test-suite:
    name: full test suite (nextest + doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: nextest
          cache-bin: false
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: nextest@0.9.143
      - name: Clear cached nextest reports
        run: rm -f target/nextest/{ci,ci-release}/junit.xml
      # Unit + integration tests. `--no-tests=fail` makes the hard-fail-on-empty intent
      # explicit (nextest's default is `auto`, which only *happens* to resolve to fail for a
      # whole-workspace run — pinning it keeps the gate correct if the invocation ever narrows).
      - name: cargo nextest run (unit + integration)
        run: cargo nextest run --workspace --locked --profile ci --no-tests=fail
      # Same suite under release codegen. `ci-release` inherits the `ci` runner policy and writes a
      # separate JUnit report; the explicit cargo profile is what strips debug_assert paths and
      # exercises release panic-freedom.
      - name: cargo nextest run --release (unit + integration)
        run: cargo nextest run --workspace --locked --profile ci-release --cargo-profile release --no-tests=fail
      # Doctests — the second mandatory step, since nextest does not run doctests.
      - name: cargo test --doc (doctests)
        run: cargo test --workspace --doc --locked
      - name: Require complete nextest JUnit report set
        run: >-
          for profile in ci ci-release;
          do test -s "target/nextest/$profile/junit.xml";
          done

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  file-size-cap:
    name: file-size cap (700 LOC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - run: bash .github/scripts/check-file-size.sh

  no-secret-scan:
    name: no-secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - run: bash .github/scripts/check-no-secrets.sh

  gate-fixtures:
    name: gate behavior fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - name: no-db gate fixtures
        run: bash .github/scripts/test-check-default-no-db.sh
      - name: golden-gen firewall fixtures
        run: bash .github/scripts/test-check-golden-gen-anti-tautology.sh
      - name: stale crate-status fixtures
        run: bash .github/scripts/test-check-stale-crate-status.sh
      - name: stale crate-status smoke
        run: bash .github/scripts/check-stale-crate-status.sh
      - name: workflow gate fixtures
        run: bash .github/scripts/test-workflow-gates.sh
      - name: real workflow smoke
        run: bash .github/scripts/check-workflow-gates.sh

  unused-deps:
    name: unused dependency gate (cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97.1
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-machete
      - run: cargo machete

  default-no-db:
    name: default build links no database / async runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: default-no-db
          cache-bin: false
      - run: bash .github/scripts/check-default-no-db.sh

  golden-gen-firewall:
    name: golden-gen anti-tautology firewall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97.1
      - run: bash .github/scripts/check-golden-gen-anti-tautology.sh

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: clippy
          cache-bin: false
      - name: clippy (default — no DB)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build
          cache-bin: false
      - name: cargo build (default — no DB)
        run: cargo build --workspace --locked

  rustdoc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rustdoc
          cache-bin: false
      - name: cargo doc — libs (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --lib --document-private-items --locked
      - name: cargo doc — bins (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --bins --document-private-items --locked

  deny:
    name: cargo-deny (full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97.1
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-deny
      - run: cargo deny check bans licenses sources advisories

  # The gate script in `full` mode, EXECUTED rather than parsed. See the twin job in pr-gate.yml for
  # why this is a coverage backstop and explicitly NOT a parity check.
  #
  # `full` is the higher-stakes half. AGENTS.md instructs every agent to run `bash .agents/gate.sh
  # full` before claiming a change's tests pass — the per-PR gate runs only
  # oce-api/oce-blocks/oce-expr, so
  # for a change confined to any other crate that claim rests entirely on this script. Running it
  # here is what keeps the commands behind that instruction under CI observation.
  #
  # Wall-clock cost is nil: `test-suite` above is a ~22-minute long pole and this job runs beside
  # it, so it finishes well inside the time that job already takes.
  gate:
    name: gate (full)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@9ca9f0b320e19763058bc9531663c225d20db487 # 1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gate
          cache-bin: false
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: nextest@0.9.143,cargo-deny,cargo-machete
      # The gate script installs nothing; its no_std + alloc build steps need these targets.
      - name: Install the no_std targets
        run: rustup target add thumbv7em-none-eabihf wasm32-unknown-unknown
      - run: bash .agents/gate.sh full

  # The single required status for branch protection on `main`. It reports on every run
  # (`always()`) and fails unless every gating job succeeded. No gating job has an `if:`, so a
  # skipped job is never legitimate here. check-workflow-gates.sh asserts that `needs:` lists
  # every other job in this file.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - test-suite
      - fmt
      - file-size-cap
      - no-secret-scan
      - gate-fixtures
      - unused-deps
      - default-no-db
      - golden-gen-firewall
      - clippy
      - build
      - rustdoc
      - deny
      - gate
    runs-on: ubuntu-latest
    steps:
      - name: Require every gating job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          for job, data in sorted(needs.items()):
              print(f"{job}: {data.get('result')}")
          bad = {job: data.get("result") for job, data in needs.items()
                 if data.get("result") != "success"}
          if not needs:
              sys.exit("no gating job results reported")
          if bad:
              sys.exit(f"gating jobs not green: {bad}")
          PY
