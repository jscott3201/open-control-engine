# CI for open-control (the Open Control Engine) — runs on PRs into `development`.
#
# Workflow model: every logical change opens a PR into `development` behind this gate; releases
# batch `development` -> `main`, and a version tag drives the gated publish.
#
# This per-PR gate is the LIGHT gate: the near-instant checks plus the compile-requiring lints
# (clippy -D warnings), a workspace build, cargo-machete unused-dependency detection, and gate-script
# behavior fixtures, stale crate-status header lint, and a targeted cross-arch determinism subset
# for oce-blocks/oce-expr. It does NOT run the full engine test suite — keeping per-change PRs into
# `development` fast. The heavy test suite (cargo nextest run for unit + integration tests, cargo
# nextest run with release codegen for panic-freedom regressions, and cargo test --doc for doctests
# — nextest cannot run doctests) lives in the development -> main release gate at
# .github/workflows/release-gate.yml.
# That gate also runs daily against the `development` tip so regressions surface before the next
# release PR. It re-runs these light correctness gates against the release tip and runs cargo-deny
# unconditionally, since a `development` -> `main` PR matches no other workflow.
#
# Gates that always run: rustfmt, file-size cap (700 LOC), no-secret scan, rustdoc (-D warnings),
# clippy -D warnings, a workspace build, cargo-machete, gate-script fixtures, stale crate-status
# header lint, the targeted two-arch determinism matrix, and the default-no-db gate (the default —
# and only — build links no database / tokio / async-std anywhere in the workspace). When dependency
# manifests change, cargo-deny runs too.
#
# Deferred until first publish: the cargo-about THIRDPARTY.md attribution-currency gate (plus
# about.toml/about.hbs) is intentionally NOT wired yet — attribution hygiene is most valuable near
# crates.io publish, which is deferred. Restore the gate before the first publish.
#
# Security: no `${{ github.event.* }}` in any `run:` (confined to if:/with:/env:).

name: ci

on:
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: read
  # dorny/paths-filter calls the PR Files API to compute which paths changed.
  pull-requests: read

jobs:
  changes:
    name: detect changes
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            deps:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'deny.toml'

  fmt:
    name: fmt
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  file-size-cap:
    name: file-size cap (700 LOC)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-file-size.sh

  no-secret-scan:
    name: no-secret scan
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/check-no-secrets.sh

  default-no-db:
    name: default build links no database / async runtime
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: bash .github/scripts/check-default-no-db.sh

  golden-gen-firewall:
    name: golden-gen anti-tautology firewall
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: bash .github/scripts/check-golden-gen-anti-tautology.sh

  gate-fixtures:
    name: gate behavior fixtures
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no-db gate fixtures
        run: bash .github/scripts/test-check-default-no-db.sh
      - name: golden-gen firewall fixtures
        run: bash .github/scripts/test-check-golden-gen-anti-tautology.sh
      - name: stale crate-status fixtures
        run: bash .github/scripts/test-check-stale-crate-status.sh
      - name: stale crate-status smoke
        run: bash .github/scripts/check-stale-crate-status.sh
      - name: workflow gate fixtures
        run: bash .github/scripts/test-workflow-gates.sh
      - name: real workflow smoke
        run: bash .github/scripts/check-workflow-gates.sh

  unused-deps:
    name: unused dependency gate (cargo-machete)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  determinism-matrix:
    name: determinism-matrix (${{ matrix.runner }})
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.133
      - name: cargo nextest determinism subset
        run: cargo nextest run -p oce-blocks -p oce-expr --locked --profile ci --no-tests=fail
      - name: cargo nextest determinism subset --release
        run: cargo nextest run -p oce-blocks -p oce-expr --locked --profile ci --cargo-profile release --no-tests=fail

  clippy:
    name: clippy (-D warnings)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (default — no DB)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: build
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo build (default — no DB)
        run: cargo build --workspace --locked

  rustdoc:
    name: rustdoc (-D warnings)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc — libs (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --lib --document-private-items --locked
      # No binary targets exist at M0 (every oce-* crate is a library), so this pass docs nothing
      # today — it future-proofs the -D warnings doc gate so a later CLI / conformance-runner bin
      # cannot ship undocced.
      - name: cargo doc — bins (deny warnings)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace --bins --document-private-items --locked

  deny:
    name: cargo-deny
    needs: changes
    if: |
      (github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check bans licenses sources

  # The gate script, EXECUTED rather than parsed.
  #
  # This is not a parity check and a green run here is not evidence of one. Nothing in this repo
  # verifies mechanically that .agents/gate.sh and this file still list the same commands; that
  # attempt was made and withdrawn (62c0845). Every design for it either compared argv strings —
  # which `RUSTFLAGS=--cap-lints=allow` leaves byte-identical while neutering clippy — or
  # reimplemented enough of `if:` / `needs:` / matrix semantics to become its own untested gate.
  #
  # What this job adds instead is coverage that survives drift. If a job above is ever weakened or
  # deleted, the command still runs here on the same PR, so the check does not silently disappear
  # with it. That is a weaker claim than parity and deliberately so: executing a script asserts
  # nothing static, so it cannot be false-green about whether two files agree.
  #
  # It duplicates roughly a minute of compute per PR. On a public repo the runner minutes are not
  # metered, and the duplication is the point — a backstop that shared a cause of failure with the
  # thing it backs up would not be one.
  #
  # NOT protected by a grep pin in check-workflow-gates.sh, deliberately. A pin was written for
  # this job and removed after review: a `run: "true"` step plus the pinned text left behind in a
  # COMMENT satisfied it, and a decoy no-op job carrying this display name satisfied it alongside a
  # real job rewired to skip. That is the same false-green that got the earlier parity mechanism
  # withdrawn, and a text search cannot be made to tell an executable step from a comment. Making
  # it sound means parsing the YAML and reasoning about `if:` / `needs:` / `continue-on-error`,
  # which is the unbounded reimplementation that attempt died on.
  #
  # What protects it instead is branch protection: `gate (light)` is a REQUIRED status check on
  # `development`, so deleting or renaming this job means the required context never reports and
  # the PR cannot merge. That is enforced by GitHub rather than by a string search, and it is the
  # reason the display name below must not change casually.
  gate:
    name: gate (light)
    if: github.event.pull_request.draft == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.133,cargo-deny,cargo-machete
      # No `--` arguments: `light` is the default mode and the one this job exists to cover.
      - run: bash .agents/gate.sh
