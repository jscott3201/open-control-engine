# ── Math discipline (issue #399) ─────────────────────────────────────────────
# Every `f64`/`f32` method below exists only in `std`: `core` on the pinned 1.97.1 toolchain lacks
# it (probed per method; the table is in TESTING.md "Conventions"). The core four (`oce-model`,
# `oce-expr`, `oce-blocks`, `oce-graph`) build `no_std + alloc`, and their numerics are bound to the
# pinned `libm`, so they call these operations through their crate's `math` module instead.
# `disallowed_methods` is allowed workspace-wide in `Cargo.toml` and denied in each core crate root,
# so this list binds only the core four; `std` crates and the Tier-A generator keep `std` methods.
# `scripts/ci/test-math-lint.sh` proves a std float method in the core fails clippy.
