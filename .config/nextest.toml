# .config/nextest.toml — cargo-nextest configuration for the open-control workspace.
#
# Schema verified against nextest 0.9.143 (the pinned CI + local version). nextest is the
# test runner for unit + integration tests, locally and in CI. Doctests run SEPARATELY via
# `cargo test --doc` — nextest cannot run doctests (a stable-Rust limitation, not a config
# switch), so any CI/local test pass is two commands, never one.
#
# Profiles:
#   default — local dev: fast, fail-fast feedback (`cargo nextest run`).
#   ci      — local gate + CI debug-codegen runs: no fail-fast, no retries, JUnit output.
#   ci-release — inherits `ci` for release-codegen runs and writes a separate JUnit report.
#   ci-release-workspace — inherits `ci` for ONE run, the whole workspace suite under release
#                 codegen (`bash .agents/gate.sh full`, executed by release-gate.yml's `gate (full)`
#                 job). It exists for its report path: the determinism subset and the strict-bit
#                 step also run under release codegen in that mode and write `ci-release`'s
#                 report, so a requirement on that file could not tell whether the workspace run
#                 happened (issue #545). Nothing else may use this profile.
#
# For a deterministic, safety-critical control engine the gate must be reproducible: no
# retries, no flake-tolerance, hard-fail if zero tests are discovered (see release-gate.yml's
# explicit `--no-tests=fail`, which catches "tests silently stopped compiling / being found").

nextest-version = { required = "0.9.143", recommended = "0.9.143" }

[profile.default]
# Local runs stop scheduling after the first failure, but wait for already-running tests so their
# cleanup logic completes.
fail-fast = true

# Never hide a flaky test. `flaky-result` also protects a future per-test retry override: a retry
# may gather evidence, but a later pass still leaves the run red.
retries = 0
flaky-result = "fail"

# Flag at 60s and terminate at 120s. Child processes that retain output handles for more than 2s
# after their test exits are failures rather than advisory LEAK statuses.
slow-timeout = { period = "60s", terminate-after = 2, on-timeout = "fail" }
leak-timeout = { period = "2s", result = "fail" }

# Bounds a pathological run even when no one test reaches its individual timeout.
global-timeout = "15m"

[profile.ci]
# Run the whole suite even when something fails, so a single run reports every failure
# instead of stopping at the first.
fail-fast = false

# Show each failure's output inline as it happens, then a consolidated block at the end.
# Valid values: immediate | immediate-final | final | never  (default: immediate).
failure-output = "immediate-final"

# Keep passing-test output out of the log.
# Valid values: immediate | immediate-final | final | never  (default: never).
success-output = "never"

# Per-test status lines WHILE running: only print failures, to keep CI logs small and
# consistent with `success-output = "never"`. Incremental set:
#   none, fail, retry, slow, leak, pass, skip, all  (default: pass).
status-level = "fail"

# End-of-run summary. Incremental set:
#   none, fail, flaky, slow, skip, leak, pass, all  (default: flaky).
# "slow" includes fail + flaky and also surfaces slow tests in the summary.
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"
report-name = "open-control-ci"
store-success-output = false
store-failure-output = true
report-skipped = "ignored"
flaky-fail-status = "failure"

[profile.ci-release]
inherits = "ci"

[profile.ci-release.junit]
report-name = "open-control-ci-release"

[profile.ci-release-workspace]
inherits = "ci"

[profile.ci-release-workspace.junit]
report-name = "open-control-ci-release-workspace"
