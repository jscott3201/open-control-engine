# Open Control Engine — workspace root.
#
# A high-performance, embeddable Rust control engine that natively executes the
# OBC/LBL Control Description Language (CDL) for smart-building equipment.
#
# The dependency direction is intentional and acyclic, organized around the CDL
# §7.17 non-computational seam:
#   GROUP A — execution core (NO store, NO database):
#     oce-model -> {oce-expr, oce-blocks, oce-flatten, oce-validate, oce-graph,
#                   oce-cxf, oce-semantics}
#   STORAGE PORTS (traits only, NO database):
#     oce-store -> {oce-store-mem (default)}
#   GROUP C — verification / externals / host facade:
#     oce-conformance, oce-extension, oce-docs, oce-api (the single public surface)
#
# The library ships NO first-party database; it is database-free, full stop
# (D-OWNER-1). The default (and only) build links no database and no async runtime.
# Durable/queryable backends are the consuming application's responsibility, authored
# app-side behind the `oce-store` port. The CI gate
# (.github/scripts/check-default-no-db.sh) enforces the no-DB/no-async posture structurally.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV. MUST NOT EXCEED the gate-only nightly pinned as `NIGHTLY` in
# .github/workflows/release-gate.yml — today nightly-2026-05-01, which identifies as
# `rustc 1.97.0-nightly`. That nightly is a TOOL, not a build target: it emits rustdoc JSON for the
# `cargo public-api` surface gates. But `rustdoc_json::Builder::toolchain()` shells out to
# `cargo +<nightly> rustdoc`, which resolves the whole workspace, so Cargo enforces THIS line
# against it. Setting `1.97.1` here (PR #208) failed both surface gates with
# `rustc 1.97.0-nightly is not supported by the following packages`, and per-PR CI cannot see it —
# those gates run only in release-gate.yml. To raise this above the nightly, bump `NIGHTLY` first
# and re-bless both public-api baselines.
#
# The pinned BUILD toolchain (rust-toolchain.toml) is 1.97.1 and stays there; 1.97.1 is a patch
# release of 1.97.0, so the declared floor is honest. It is also genuinely exercised: release-gate
# builds the whole workspace under the 1.97.0-class nightly on every release PR.
rust-version = "1.97.0"
authors = ["Justin Scott"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jscott3201/open-control-engine"
homepage = "https://github.com/jscott3201/open-control-engine"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "deny"
dbg_macro = "deny"
print_stderr = "warn"
print_stdout = "warn"

[workspace.dependencies]
# --- Shared infra pins. ---
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2.0"
libm = { version = "0.2.16", default-features = false }

# --- Internal crates (path + version; centralized so a single edit re-points them). The explicit
# version (matching workspace.package.version) keeps these from reading as wildcard deps and makes
# them publish-ready; the path wins for in-workspace builds. ---
oce-model = { path = "crates/oce-model", version = "0.1.0" }
oce-expr = { path = "crates/oce-expr", version = "0.1.0" }
oce-diag = { path = "crates/oce-diag", version = "0.1.0" }
oce-blocks = { path = "crates/oce-blocks", version = "0.1.0" }
oce-flatten = { path = "crates/oce-flatten", version = "0.1.0" }
oce-validate = { path = "crates/oce-validate", version = "0.1.0" }
oce-graph = { path = "crates/oce-graph", version = "0.1.0" }
oce-cxf = { path = "crates/oce-cxf", version = "0.1.0" }
oce-semantics = { path = "crates/oce-semantics", version = "0.1.0" }
oce-store = { path = "crates/oce-store", version = "0.1.0" }
oce-store-mem = { path = "crates/oce-store-mem", version = "0.1.0" }
oce-conformance = { path = "crates/oce-conformance", version = "0.1.0" }
oce-extension = { path = "crates/oce-extension", version = "0.1.0" }
oce-docs = { path = "crates/oce-docs", version = "0.1.0" }
oce-api = { path = "crates/oce-api", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
debug = "line-tables-only"
incremental = true
