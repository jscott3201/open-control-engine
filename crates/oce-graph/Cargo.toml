[package]
name = "oce-graph"
description = "The deterministic dataflow scheduler/executor (own Kahn sort, tick loop) for the Open Control Engine (Group A; no store, no database)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
oce-model = { workspace = true }
oce-blocks = { workspace = true }
thiserror = { workspace = true }

[features]
# `std` is the default; `--no-default-features --features alloc` builds the crate `no_std + alloc`
# (see docs/architecture.md, "Embeddability posture").
default = ["std"]
std = ["alloc", "oce-model/std", "oce-blocks/std", "thiserror/std"]
alloc = ["oce-model/alloc", "oce-blocks/alloc"]
