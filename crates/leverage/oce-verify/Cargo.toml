# Verification over vectors, above the facade (design note docs/design/vectors.md, issues #519 and
# #520, #521): the `oce/vectors/v1` format (a strict bounded reader, the canonical writer,
# `spec_id`, the load-stage error codes and the pinned JSON Schema), the run (binding a set to a
# subject, replaying each scenario through `oce-replay`, the exact comparison and the receipt) and
# mutant mode. Among `oce-*`
# packages it depends on `oce-api` and the leverage crate `oce-replay` only
# (crates/leverage/README.md), with `oce-bless` as a dev-dependency for the golden switch
# (authoring note decision 19).
[package]
name = "oce-verify"
description = "Vector verification for Open Control Engine sequences: the oce/vectors/v1 format with a strict bounded reader, a canonical writer, spec ids and a pinned JSON Schema, exact replay of a set against a sequence with receipts, and a mutant catch score."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Nothing above the facade is published yet (authoring note decision 20).
publish = false

[lints]
workspace = true

[dependencies]
# The facade: the subject is loaded, its boundary and parameters read, its parameters edited and
# its content id taken through `oce-api` only (crates/leverage/README.md).
oce-api = { workspace = true }
# Each scenario is one replay over a step source on the set's grid (vectors note decision 3), and
# the vector format resolves names by replay's one rule (decision 6).
oce-replay = { path = "../oce-replay" }
# The JSON Schema of the format is derived from the reader's own types (vectors note decision 17);
# the same crate and exact version as `oce-author`, so the lockfile gains no package.
schemars = { version = "=1.2.3", default-features = false, features = ["derive", "std"] }
# `schemars` hands the derived schema over as a `serde_json::Value`, which the canonical writer
# walks. Nothing here parses with it: the reader is this crate's own strict cursor.
serde_json = { workspace = true }

[dev-dependencies]
oce-bless = { workspace = true }
# The load-cost test measures allocations on the reading thread; the crate and version
# `oce-replay` already uses.
allocation-counter = "0.8.1"
