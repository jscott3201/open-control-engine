# The `oce` command-line tool (authoring note docs/design/authoring-layer.md, "CLI", decisions 9 and
# 20; issue #489): `emit`, `validate`, `fmt`, `catalog`, `vocab`, `verify`, `id`, `import` and `diff`
# over `oce-author`, `oce-verify`, `oce-diff` and the facade. The first binary above the facade:
# engine crates ship none (docs/architecture.md). It depends on `oce-api` and the leverage crates
# `oce-author`, `oce-vocab`, `oce-verify` and `oce-diff` only among the `oce-*` packages
# (crates/leverage/README.md; vocabulary note decision 10, issue #500; vectors note decision 34,
# issue #522; diff note decision 9, issue #668); `oce-bless` is a dev-dependency for the golden
# switch (decision 19).
[package]
name = "oce-cli"
description = "The oce command-line tool: emit, validate, fmt, catalog, vocab, verify, id, import and diff over the Open Control Engine authoring layer, vector and commissioning verification and structural diff."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Nothing above the facade is published in M2 (decision 20).
publish = false

[lints]
workspace = true

[[bin]]
name = "oce"
path = "src/main.rs"

[dependencies]
oce-api = { workspace = true }
oce-author = { path = "../oce-author" }
# The block vocabulary `oce catalog` serves and the scale-factor table `oce vocab` prints.
oce-vocab = { path = "../oce-vocab" }
# Verification (`oce verify`, vectors note decision 34; commissioning note, "CLI"): the vector set
# and the commissioning spec, their runs and the receipt.
oce-verify = { path = "../oce-verify" }
# Structural diff (`oce diff`, diff note decision 9): the authoring diff, the CXF adapter and the
# two renderers. A leverage-to-leverage edge, allowed by crates/leverage/README.md's rule 1.
oce-diff = { path = "../oce-diff" }
# Argument parsing with derive (decision 20): M2's second new third-party dependency, confined to
# crates/leverage/. No `color` feature, so `--help` and every usage error are plain bytes that do
# not depend on the terminal.
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
serde_json = { workspace = true }

# The crate's third-party edge after clap, ruled by the owner on 2026-11-22 (issue #758): the
# workspace's `rustix` (already in the lock through `oce-cxf`'s tests), whose safe `openat` with
# `O_DIRECTORY | O_NOFOLLOW` opens each component of a file a document names from its parent's
# handle (`src/commands/contained.rs`), so no directory swapped for a link can carry a read out
# of the document's directory. Unix only; Windows keeps the path-based checks.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
oce-bless = { workspace = true }
