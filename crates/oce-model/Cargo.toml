[package]
name = "oce-model"
description = "Pure CDL value/connector/instance/connection types for the Open Control Engine (Group A; no store, no database)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# For the resolved-model DTOs' serde derives; no codec is linked here. `alloc` is the floor (the
# DTOs hold `String`/`Vec`); `std` re-enables `serde/std` through this crate's `std` feature.
serde = { workspace = true, features = ["alloc"] }

[features]
# `std` is the default; `--no-default-features --features alloc` builds the crate `no_std + alloc`
# (see docs/architecture.md, "Embeddability posture").
default = ["std"]
std = ["alloc", "serde/std"]
alloc = []
