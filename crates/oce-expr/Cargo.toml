[package]
name = "oce-expr"
description = "CDL §7.7.2 binding-expression parser and evaluator for the Open Control Engine (Group A; no store, no database)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# `floor`/`ceil`/`trunc`/`sqrt` without `std`; the same pinned `libm` the block library uses.
libm = { workspace = true }
oce-model = { workspace = true }
thiserror = { workspace = true }

[features]
# `std` is the default; `--no-default-features --features alloc` builds the crate `no_std + alloc`
# (see docs/architecture.md, "Embeddability posture").
default = ["std"]
std = ["alloc", "oce-model/std", "thiserror/std"]
alloc = ["oce-model/alloc"]
