[package]
name = "oce-store"
description = "THE SEAM: database-free Store ports (ModelStore/PointStore/SemanticStore), DTOs, the host-side post-load helper and the in-memory MemStore (feature `mem`) for the Open Control Engine. No DB types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
# The resolved-model DTOs this port persists are defined in the core model crate (re-exported).
oce-model = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["mem"]
# The in-memory `MemStore` backend. Off: ports, DTOs and the `host` helper only.
mem = []
