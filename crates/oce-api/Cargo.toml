# NOTE: the package is named `oce-api` to match the spec's crate map (FRAME 00 §5). The
# embeddable host facade is PUBLISHED under the umbrella name `open-control-engine` — the single
# recommended dependency for embedders — without changing this surface (08 §11 R-PUB-4).
[package]
name = "oce-api"
description = "The embeddable host facade for the Open Control Engine: Engine<S: Store = MemStore>. Published under the umbrella name open-control-engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# Default build = engine + in-memory store. NO database, NO async runtime (FRAME §6,
# D-OWNER-1). The `mem` feature is on by default and wires oce-store-mem as the default
# `Store` backend. The library ships no first-party database and no DB-gated feature;
# durable backends are app-side adapters the host wires behind the `oce-store` port.
default = ["mem"]
mem = []

[dependencies]
oce-model = { workspace = true }
oce-graph = { workspace = true }
oce-blocks = { workspace = true }
oce-cxf = { workspace = true }
oce-validate = { workspace = true }
oce-flatten = { workspace = true }
oce-semantics = { workspace = true }
oce-store = { workspace = true }
oce-store-mem = { workspace = true }
thiserror = { workspace = true }
