# NOTE: the package is named `oce-api` to match the spec's crate map (FRAME 00 §5). The
# embeddable host facade is intended for a future umbrella release named `open-control-engine`
# without changing this surface (08 §11 R-PUB-4). Nothing is published to crates.io yet.
[package]
name = "oce-api"
description = "The embeddable host facade for the Open Control Engine: a pure Engine, plain data in and plain data out."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

# No cargo features: every build is the pure engine, with no storage backend, no database and no
# async runtime (D-OWNER-1). This crate must never depend on a storage-port crate (asserted by
# `.github/scripts/check-default-no-db.sh` and `tests/frame_purity.rs`): durability is the host's,
# through an app-side adapter fed the plain-data `LoadedModel` a load returns.
[dependencies]
oce-model = { workspace = true }
oce-graph = { workspace = true }
oce-blocks = { workspace = true }
oce-cxf = { workspace = true }
# The shared diagnostic vocabulary (AD-4): LoadReport.warnings surfaces oce-cxf/oce-validate
# diagnostics in one shape, so a host never juggles two dialects.
oce-diag = { workspace = true }
oce-validate = { workspace = true }
oce-semantics = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
allocation-counter = "0.8.1"
oce-bless = { workspace = true }
