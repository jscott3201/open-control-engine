# NOTE: the package is named `oce-api` to match the spec's crate map (FRAME 00 §5). The
# embeddable host facade is intended for a future umbrella release named `open-control-engine`
# without changing this surface (08 §11 R-PUB-4). Nothing is published to crates.io yet.
[package]
name = "oce-api"
description = "The embeddable host facade for the Open Control Engine: Engine<S: Store = MemStore>."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# Default build = engine + in-memory store. NO database, NO async runtime (FRAME §6,
# D-OWNER-1). The `mem` feature is on by default and wires oce-store-mem as the default
# `Store` backend. The library ships no first-party database and no DB-gated feature;
# durable backends are app-side adapters the host wires behind the `oce-store` port.
default = ["mem"]
mem = []

[dependencies]
oce-model = { workspace = true }
oce-graph = { workspace = true }
oce-blocks = { workspace = true }
oce-cxf = { workspace = true }
# The shared diagnostic vocabulary (AD-4): LoadReport.warnings surfaces oce-cxf/oce-validate
# diagnostics in one shape, so a host never juggles two dialects.
oce-diag = { workspace = true }
oce-validate = { workspace = true }
oce-flatten = { workspace = true }
oce-semantics = { workspace = true }
oce-store = { workspace = true }
oce-store-mem = { workspace = true }
thiserror = { workspace = true }

# Gate-only public-API surface enumeration (R-PUB-3 / exit #7). These are DEV-dependencies — they
# never enter the shipped library or its dependents. The snapshot test (tests/public_api.rs) runs
# only when armed by OCE_PUBLIC_API_NIGHTLY (release-gate.yml installs the pinned nightly); the
# workspace itself stays on stable 1.97.1.
#
# COMPAT TRIPLE (M3) — the three are pinned together and must move together: public-api 0.52.x
# depends on rustdoc-types ^0.57 (FORMAT_VERSION = 57), which is exactly what nightly-2026-05-01
# (rustc 1.97.0-nightly, 2026-04-30) emits. A format_version skew is caught because the rustdoc-types
# `Crate` shape changes between versions, so the JSON fails to deserialize (a serde parse error) —
# the exact pins, not an explicit version assertion, are what keep the triple aligned. Bumping any
# one requires re-blessing tests/public-api.txt under the matching nightly.
#
# `default-features = false` on public-api drops its default `snapshot-testing` feature: that feature
# only gates `PublicApi::assert_eq_or_update`, which this crate's test does NOT use (it compares the
# blessed baseline with a first-party read-compare-or-write gated on `oce_bless::enabled`).
# Dropping it removes the `snapshot-testing` crate (license `Unlicense`, not on deny.toml's
# allow-list) from the dev tree entirely — keeping the license surface explicit.
[dev-dependencies]
oce-bless = { workspace = true }
public-api = { version = "=0.52.1", default-features = false }
rustdoc-json = "=0.9.10"
serde_json = { workspace = true }
stats_alloc = "0.1.10"
