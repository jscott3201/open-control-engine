# NOTE: the package is named `oce-api` to match the spec's crate map (FRAME 00 §5). The
# embeddable host facade is intended for a future umbrella release named `open-control-engine`
# without changing this surface (08 §11 R-PUB-4). Nothing is published to crates.io yet.
[package]
name = "oce-api"
description = "The embeddable host facade for the Open Control Engine: Engine<S: Store = MemStore>."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
# Default build = engine + in-memory store. NO database, NO async runtime (D-OWNER-1).
# `mem` is temporarily retained as a legacy no-op compatibility spelling for downstream
# manifests. It gates nothing: `oce-store-mem` remains an unconditional normal dependency,
# including with `--no-default-features`, and `MemStore` remains the default `Store` type.
# Removal waits for downstream manifest migration. There is no DB-gated feature; durable
# backends are app-side adapters the host wires behind the `oce-store` port.
default = ["mem"]
mem = []

[dependencies]
oce-model = { workspace = true }
oce-graph = { workspace = true }
oce-blocks = { workspace = true }
oce-cxf = { workspace = true }
# The shared diagnostic vocabulary (AD-4): LoadReport.warnings surfaces oce-cxf/oce-validate
# diagnostics in one shape, so a host never juggles two dialects.
oce-diag = { workspace = true }
oce-validate = { workspace = true }
oce-flatten = { workspace = true }
oce-semantics = { workspace = true }
oce-store = { workspace = true }
oce-store-mem = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
allocation-counter = "0.8.1"
oce-bless = { workspace = true }
