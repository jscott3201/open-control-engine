[package]
name = "oce-blocks"
description = "The CDL elementary-block library and Block trait for the Open Control Engine (Group A; no store, no database)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
libm = { workspace = true }
oce-model = { workspace = true }

[features]
# `std` is the default; `--no-default-features --features alloc` builds the crate `no_std + alloc`
# (see docs/architecture.md, "Embeddability posture").
default = ["std"]
std = ["alloc", "oce-model/std"]
alloc = ["oce-model/alloc"]

[dev-dependencies]
allocation-counter = "0.8.1"
oce-bless = { workspace = true }
serde_json = { workspace = true }
